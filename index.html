
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop 2 - Tailwind Components</title>
  <link href="style.css" rel="stylesheet">
</head>

<body class="bg-gray-100 p-6 font-sans text-gray-800">

  <main class="mx-auto max-w-6xl space-y-10">

    <header>
      <h1 class="text-3xl font-bold">Tailwind Component Library</h1>
      <p class="mt-2 text-gray-600">
        Workshop 2: Buttons, Cards and Alerts
      </p>
    </header>

    <!-- BUTTONS -->
    <section class="space-y-4">
      <h2 class="text-2xl font-bold">1. Buttons</h2>

      <div class="flex flex-wrap items-center gap-4">
        <button class="btn-primary">
          Primary
        </button>

        <button class="btn-secondary">
          Secondary
        </button>

        <button class="btn-outline">
          Outline
        </button>

        <button class="btn-primary" disabled>
          Disabled
        </button>
      </div>
    </section>

</body>
</html>
